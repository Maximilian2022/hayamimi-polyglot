name: CI & Portable Release Pipeline

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: ci-portable-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -------------------------------------------------------------
  # Job 1: Verify One-liner Clean Setup & Full Core Test Suite
  # -------------------------------------------------------------
  test-oneliner:
    name: Verify Setup & Core Tests (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install uv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          $uvDir = Join-Path $env:USERPROFILE ".local\bin"
          $uvDir | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Cache AI Models
        uses: actions/cache@v6
        with:
          path: models
          key: models-int8-full-v2

      - name: Ensure Complete AI Models (Python 3.14)
        shell: bash
        run: uv run --python 3.14 python scripts/download_models.py

      - name: Verify Windows One-liner Setup & Test Suites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installPath = Join-Path $env:RUNNER_TEMP "hayamimi-oneliner-test"
          New-Item -ItemType Directory -Path $installPath -Force | Out-Null
          Copy-Item -Path "models" -Destination (Join-Path $installPath "models") -Recurse -Force
          Write-Host "Testing setup.ps1 under Windows PowerShell 5.1 (powershell.exe) in unattended mode..."
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1 -Unattended -InstallPath $installPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PYTHONIOENCODING = "utf-8"
          $pyExe = Join-Path $installPath ".venv\Scripts\python.exe"
          & $pyExe -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version; from PySide6 import QtCore, QtWidgets; import main; print('[OK] Windows One-liner setup passed!')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $pyExe (Join-Path $installPath "test_polyglot_suite.py")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $pyExe (Join-Path $installPath "test_npu_suite.py")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Smart App Control Reputation & Signatures (Defender ISG)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installPath = Join-Path $env:RUNNER_TEMP "hayamimi-oneliner-test"
          $pyExe = Join-Path $installPath ".venv\Scripts\python.exe"
          Write-Host "Attempting to enable Microsoft Defender MAPS cloud reputation queries on runner..."
          try {
            Remove-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet" -Name "SpynetReporting" -ErrorAction SilentlyContinue
            Remove-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet" -Name "SubmitSamplesConsent" -ErrorAction SilentlyContinue
            Start-Service -Name WinDefend -ErrorAction SilentlyContinue
            Set-MpPreference -MAPSReporting Advanced -SubmitSamplesConsent SendSafeSamples -ErrorAction SilentlyContinue
          } catch {
            Write-Host "Note: Defender MAPS preference unchanged on runner ($($_.Exception.Message))"
          }
          & $pyExe (Join-Path $installPath "scripts\check_sac_trust.py") --allow-runner-no-cloud
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify macOS One-liner Setup & Test Suite
        if: runner.os == 'macOS'
        shell: bash
        run: |
          INSTALL_PATH="$HOME/hayamimi-oneliner-test"
          mkdir -p "$INSTALL_PATH"
          cp -R models "$INSTALL_PATH/models"
          chmod +x ./setup.sh
          ./setup.sh "$INSTALL_PATH" --unattended

          TEST_PY="$INSTALL_PATH/.venv/bin/python"
          QT_QPA_PLATFORM=offscreen PYTHONIOENCODING=utf-8 "$TEST_PY" -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version; from PySide6 import QtCore, QtWidgets; import main; print('[OK] macOS One-liner setup passed!')"
          QT_QPA_PLATFORM=offscreen PYTHONIOENCODING=utf-8 "$TEST_PY" "$INSTALL_PATH/test_polyglot_suite.py"

  # -------------------------------------------------------------
  # Job 2: Build, Verify Signatures & Release Portable Packages
  # -------------------------------------------------------------
  build-and-release:
    name: Build & Verify Portable (${{ matrix.os }})
    needs: test-oneliner
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_suffix: windows
            build_script: scripts/build_portable_win.py
          - os: macos-latest
            os_suffix: macos
            build_script: scripts/build_portable_mac.py
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read Version from version.txt
        id: version
        shell: bash
        run: |
          VER=$(cat version.txt | tr -d ' \r\n')
          echo "VERSION=${VER}" >> $GITHUB_OUTPUT
          echo "TAG=v${VER}" >> $GITHUB_OUTPUT
          echo "PKG_NAME=hayamimi-polyglot-v${VER}-${{ matrix.os_suffix }}-portable.zip" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VER}, tag: v${VER}"

      - name: Install uv (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install uv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          $uvDir = Join-Path $env:USERPROFILE ".local\bin"
          $uvDir | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Cache or Fetch AI Models
        id: cache-models
        uses: actions/cache@v6
        with:
          path: models
          key: models-int8-full-v2

      - name: Ensure Complete AI Models (Python 3.14)
        run: |
          uv run --python 3.14 python scripts/download_models.py
        shell: bash

      - name: Build, Audit Signatures & Run Headless Smoke Test
        run: |
          uv run --python 3.14 --with pip --with setuptools --with wheel python ${{ matrix.build_script }}
        shell: bash

      - name: Ensure GitHub Release Exists & Refresh Release Notes
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist. Creating with auto-generated release notes..."
            gh release create "$TAG" --title "Hayamimi Polyglot $TAG" --generate-notes || true
          else
            echo "Release $TAG already exists. Refreshing auto-generated release notes via API..."
            NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$TAG" -q .body 2>/dev/null || true)
            if [ -n "$NOTES" ]; then
              gh release edit "$TAG" --notes "$NOTES" || true
            fi
          fi
        shell: bash

      - name: Upload Portable Package to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          PKG="${{ steps.version.outputs.PKG_NAME }}"
          echo "Uploading $PKG to release $TAG ..."
          gh release upload "$TAG" "$PKG" --clobber
        shell: bash
