name: CI & Portable Release Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Verify One-liner Clean Installation (Windows & macOS)
  # -------------------------------------------------------------
  test-oneliner:
    name: Verify One-liner (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install uv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          $uvDir = Join-Path $env:USERPROFILE ".local\bin"
          $uvDir | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify Windows One-liner Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installPath = Join-Path $env:RUNNER_TEMP "hayamimi-oneliner-test"
          Write-Host "Testing setup.ps1 in unattended mode..."
          & .\setup.ps1 -Unattended -InstallPath $installPath
          
          $pyExe = Join-Path $installPath ".venv\Scripts\python.exe"
          $testCmd = "import os; os.environ['QT_QPA_PLATFORM'] = 'offscreen'; from PySide6 import QtCore, QtWidgets; import main; print('[OK] Windows One-liner setup passed!')"
          & $pyExe -c $testCmd

      - name: Verify macOS One-liner Setup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          INSTALL_PATH="$HOME/hayamimi-oneliner-test"
          chmod +x ./setup.sh
          ./setup.sh "$INSTALL_PATH" --unattended
          
          TEST_PY="$INSTALL_PATH/.venv/bin/python"
          QT_QPA_PLATFORM=offscreen "$TEST_PY" -c "import os; from PySide6 import QtCore, QtWidgets; import main; print('[OK] macOS One-liner setup passed!')"

  # -------------------------------------------------------------
  # Job 2: Build, Verify & Release Portable Packages (Win & Mac)
  # -------------------------------------------------------------
  build-and-release:
    name: Build & Release Portable (${{ matrix.os }})
    needs: test-oneliner
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_suffix: windows
            build_script: scripts/build_portable_win.py
          - os: macos-latest
            os_suffix: macos
            build_script: scripts/build_portable_mac.py
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read Version from version.txt
        id: version
        shell: bash
        run: |
          VER=$(cat version.txt | tr -d ' \r\n')
          echo "VERSION=${VER}" >> $GITHUB_OUTPUT
          echo "TAG=v${VER}" >> $GITHUB_OUTPUT
          echo "PKG_NAME=hayamimi-polyglot-v${VER}-${{ matrix.os_suffix }}-portable.zip" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VER}, tag: v${VER}"

      - name: Install uv (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install uv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          $uvDir = Join-Path $env:USERPROFILE ".local\bin"
          $uvDir | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Cache or Fetch AI Models
        id: cache-models
        uses: actions/cache@v6
        with:
          path: models
          key: models-int8-v1

      - name: Download Base Models if not cached
        if: steps.cache-models.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          echo "Fetching models for $TAG (falling back to v1.0.0 if not yet published)..."
          if ! gh release download "$TAG" --pattern "*windows-portable.zip" 2>/dev/null; then
            gh release download v1.0.0 --pattern "*windows-portable.zip"
          fi
          ZIP_NAME=$(ls *windows-portable.zip | head -n 1)
          unzip -q "$ZIP_NAME" "hayamimi-polyglot/models/*"
          mv hayamimi-polyglot/models ./models
          rm -rf hayamimi-polyglot "$ZIP_NAME"
        shell: bash

      - name: Build & Run Headless Verification Smoke Test
        run: |
          uv run --python 3.12 python ${{ matrix.build_script }}
        shell: bash

      - name: Ensure GitHub Release Exists & Refresh Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist. Creating with auto-generated release notes..."
            gh release create "$TAG" --title "Hayamimi Polyglot $TAG" --generate-notes || true
          else
            echo "Release $TAG already exists. Refreshing auto-generated release notes via API..."
            NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$TAG" -q .body 2>/dev/null || true)
            if [ -n "$NOTES" ]; then
              gh release edit "$TAG" --notes "$NOTES" || true
            fi
          fi
        shell: bash

      - name: Upload Portable Package to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          PKG="${{ steps.version.outputs.PKG_NAME }}"
          echo "Uploading $PKG to release $TAG ..."
          gh release upload "$TAG" "$PKG" --clobber
        shell: bash
