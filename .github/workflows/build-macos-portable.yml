name: Build macOS Arm64 Portable Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-macos-portable.yml'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14 # Apple Silicon (M1/M2/M3/M4)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download Windows Portable Package from Release for base assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.0.0 --pattern "hayamimi-polyglot-v1.0.0-windows-portable.zip"
          unzip -q hayamimi-polyglot-v1.0.0-windows-portable.zip -d base_unpacked
          rm hayamimi-polyglot-v1.0.0-windows-portable.zip

      - name: Setup macOS Native Python Environment
        run: |
          mkdir -p macos_portable/hayamimi-polyglot
          cd macos_portable/hayamimi-polyglot

          # Copy core files and optimized models from base_unpacked
          cp -R ../../base_unpacked/hayamimi-polyglot/models ./
          cp -R ../../base_unpacked/hayamimi-polyglot/dicts ./
          cp -R ../../base_unpacked/hayamimi-polyglot/core ./
          cp -R ../../base_unpacked/hayamimi-polyglot/ui ./
          cp ../../base_unpacked/hayamimi-polyglot/main.py ./
          cp ../../base_unpacked/hayamimi-polyglot/config.default.json ./
          cp ../../base_unpacked/hayamimi-polyglot/config.json ./
          cp ../../base_unpacked/hayamimi-polyglot/Third_Party_Notices.md ./
          cp ../../base_unpacked/hayamimi-polyglot/LICENSE ./
          cp ../../base_unpacked/hayamimi-polyglot/README.md ./
          cp ../../base_unpacked/hayamimi-polyglot/version.txt ./

          # Create macOS Native .venv with uv (Python 3.14)
          uv venv .venv --python 3.14
          uv pip install -r ../../requirements.txt --python .venv/bin/python

          # Copy start scripts
          cp ../../start.sh ./start.sh
          chmod +x ./start.sh

          # Create double-clickable .command launcher for macOS
          cat << 'EOF' > "Hayamimi Polyglot.command"
#!/usr/bin/env bash
DIR="$(cd "$(dirname "$0")" && pwd)"
cd "$DIR"
chmod +x ./start.sh
./start.sh
EOF
          chmod +x "Hayamimi Polyglot.command"

      - name: Create macOS Portable ZIP
        run: |
          cd macos_portable
          zip -r -q ../hayamimi-polyglot-v1.0.0-macos-arm64-portable.zip hayamimi-polyglot

      - name: Upload macOS Asset to Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 hayamimi-polyglot-v1.0.0-macos-arm64-portable.zip --clobber
